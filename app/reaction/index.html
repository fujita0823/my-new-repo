<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#22d3ee" />
  <title>反応速度テスト · LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff9f2;
      --fg: #221c30;
      --muted: #6f6480;
      --wait: #7c5cff;
      --go: #22d3ee;
      --early: #ff5d8f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181229;
        --fg: #f6f1fb;
        --muted: #b6aecb;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Nunito", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      touch-action: manipulation;
    }
    a.back {
      align-self: flex-start;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.6rem;
      margin: 0 0 0.25rem;
    }
    p.lead {
      color: var(--muted);
      margin: 0 0 1.5rem;
      text-align: center;
    }
    #stage {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      background: var(--wait);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Fredoka", sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 1.5rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    #stage.go { background: var(--go); }
    #stage.early { background: var(--early); }
    #stats {
      margin-top: 1.5rem;
      display: flex;
      gap: 2rem;
      text-align: center;
    }
    #stats div span {
      display: block;
      font-family: "Fredoka", sans-serif;
      font-size: 1.6rem;
    }
    #stats div small {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <a class="back" href="../">← LAB</a>
  <h1>⚡ 反応速度テスト</h1>
  <p class="lead">色が変わった瞬間にタップ。フライングは無効。</p>
  <div id="stage">タップして開始</div>
  <div id="stats">
    <div><span id="last">–</span><small>今回 (ms)</small></div>
    <div><span id="best">–</span><small>ベスト (ms)</small></div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const lastEl = document.getElementById("last");
    const bestEl = document.getElementById("best");
    const STORAGE_KEY = "reaction-best";

    let state = "idle";
    let timerId = null;
    let goAt = 0;

    let best = Number(localStorage.getItem(STORAGE_KEY));
    if (best) bestEl.textContent = best;

    function reset(text) {
      state = "idle";
      stage.className = "";
      stage.textContent = text;
    }

    function startRound() {
      state = "waiting";
      stage.className = "";
      stage.textContent = "待って…";
      const delay = 1000 + Math.random() * 2500;
      timerId = setTimeout(() => {
        state = "go";
        goAt = performance.now();
        stage.classList.add("go");
        stage.textContent = "今だ!";
      }, delay);
    }

    stage.addEventListener("click", () => {
      if (state === "idle") {
        startRound();
        return;
      }
      if (state === "waiting") {
        clearTimeout(timerId);
        stage.classList.add("early");
        stage.textContent = "早い!もう一度";
        state = "early";
        return;
      }
      if (state === "go") {
        const elapsed = Math.round(performance.now() - goAt);
        lastEl.textContent = elapsed;
        if (!best || elapsed < best) {
          best = elapsed;
          bestEl.textContent = best;
          localStorage.setItem(STORAGE_KEY, String(best));
        }
        reset(`${elapsed}ms · もう一度タップ`);
        return;
      }
      if (state === "early") {
        reset("タップして開始");
      }
    });
  </script>
</body>
</html>
