<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff5d8f" />
  <title>ポモドーロタイマー · LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff9f2;
      --fg: #221c30;
      --muted: #6f6480;
      --work: #ff5d8f;
      --break: #22d3ee;
      --track: #f0e0e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181229;
        --fg: #f6f1fb;
        --muted: #b6aecb;
        --track: #3a2c53;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Nunito", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    a.back {
      align-self: flex-start;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.6rem;
      margin: 0 0 1.5rem;
    }
    .ring-wrap {
      position: relative;
      width: 260px;
      height: 260px;
    }
    svg { transform: rotate(-90deg); }
    circle.track { stroke: var(--track); }
    circle.progress {
      stroke: var(--work);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
    }
    .ring-wrap .label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .time {
      font-family: "Fredoka", sans-serif;
      font-size: 2.6rem;
    }
    .mode {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .controls button {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--work);
      color: #fff;
    }
    .controls button.secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--track);
    }
    .cycles {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <a class="back" href="../">← LAB</a>
  <h1>🍅 ポモドーロタイマー</h1>

  <div class="ring-wrap">
    <svg width="260" height="260">
      <circle class="track" cx="130" cy="130" r="115" fill="none" stroke-width="14" />
      <circle id="progress" class="progress" cx="130" cy="130" r="115" fill="none" stroke-width="14" />
    </svg>
    <div class="label">
      <span class="time" id="time">25:00</span>
      <span class="mode" id="mode">WORK</span>
    </div>
  </div>

  <div class="controls">
    <button id="toggle" type="button">スタート</button>
    <button id="reset" class="secondary" type="button">リセット</button>
  </div>
  <p class="cycles" id="cycles">完了したセット: 0</p>

  <script>
    const WORK_SEC = 25 * 60;
    const BREAK_SEC = 5 * 60;
    const CIRCUMFERENCE = 2 * Math.PI * 115;

    const timeEl = document.getElementById("time");
    const modeEl = document.getElementById("mode");
    const progressEl = document.getElementById("progress");
    const toggleBtn = document.getElementById("toggle");
    const resetBtn = document.getElementById("reset");
    const cyclesEl = document.getElementById("cycles");

    progressEl.style.strokeDasharray = `${CIRCUMFERENCE}`;

    let mode = "work";
    let remaining = WORK_SEC;
    let total = WORK_SEC;
    let running = false;
    let intervalId = null;
    let completedCycles = 0;

    function render() {
      const m = Math.floor(remaining / 60).toString().padStart(2, "0");
      const s = Math.floor(remaining % 60).toString().padStart(2, "0");
      timeEl.textContent = `${m}:${s}`;
      modeEl.textContent = mode === "work" ? "WORK" : "BREAK";
      progressEl.style.stroke = mode === "work" ? "var(--work)" : "var(--break)";
      const offset = CIRCUMFERENCE * (1 - remaining / total);
      progressEl.style.strokeDashoffset = `${offset}`;
      document.title = `${m}:${s} · ${mode === "work" ? "WORK" : "BREAK"} · LAB`;
    }

    function switchMode() {
      if (mode === "work") {
        completedCycles += 1;
        cyclesEl.textContent = `完了したセット: ${completedCycles}`;
        mode = "break";
        total = BREAK_SEC;
        remaining = BREAK_SEC;
      } else {
        mode = "work";
        total = WORK_SEC;
        remaining = WORK_SEC;
      }
      render();
    }

    function tick() {
      remaining -= 1;
      if (remaining <= 0) {
        switchMode();
        return;
      }
      render();
    }

    function start() {
      running = true;
      toggleBtn.textContent = "一時停止";
      intervalId = setInterval(tick, 1000);
    }

    function pause() {
      running = false;
      toggleBtn.textContent = "スタート";
      clearInterval(intervalId);
    }

    toggleBtn.addEventListener("click", () => {
      running ? pause() : start();
    });

    resetBtn.addEventListener("click", () => {
      pause();
      mode = "work";
      total = WORK_SEC;
      remaining = WORK_SEC;
      completedCycles = 0;
      cyclesEl.textContent = "完了したセット: 0";
      render();
    });

    render();
  </script>
</body>
</html>
