<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5865f2" />
  <title>my-new-repo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <span class="badge">WIP</span>
      <h1>my-new-repo</h1>
      <p>静的サイトのデモページ。フロントの表現力を試すための実験場。</p>
      <button id="theme-toggle" type="button" aria-label="テーマ切り替え">🌙 ダーク</button>
    </div>
  </header>

  <main>
    <section class="cards">
      <article class="card">
        <h2>レイアウト</h2>
        <p>CSS Grid でカード状に並べたレスポンシブ構成。幅を狭めると自動で1列になる。</p>
      </article>
      <article class="card">
        <h2>アニメーション</h2>
        <p>ホバーやスクロールでふわっと動く。カードにマウスを乗せてみて。</p>
      </article>
      <article class="card">
        <h2>インタラクション</h2>
        <p>下のカウンターはJSだけで動く簡単な状態管理のサンプル。</p>
        <div class="counter">
          <button id="dec" type="button">-</button>
          <span id="count">0</span>
          <button id="inc" type="button">+</button>
        </div>
      </article>
    </section>

    <section class="canvas-section">
      <h2>指でなぞってみて</h2>
      <p class="hint">近くのパーティクルが線でつながる、タッチ/マウス反応のcanvasアニメーション。</p>
      <canvas id="particles"></canvas>
    </section>
  </main>

  <footer>
    <p>Built with plain HTML / CSS / JS · GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
