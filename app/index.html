<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff5d8f" />
  <title>my-new-repo · LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff9f2;
      --fg: #221c30;
      --muted: #6f6480;
      --card-bg: #ffffff;
      --accent: #ff5d8f;
      --accent-2: #ffd23f;
      --accent-3: #22d3ee;
      --accent-4: #7c5cff;
      --border: #f0e0e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181229;
        --fg: #f6f1fb;
        --muted: #b6aecb;
        --card-bg: #241b3a;
        --border: #3a2c53;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .wrap {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-family: "Fredoka", sans-serif;
      font-size: clamp(2rem, 8vw, 3rem);
      margin: 0 0 0.5rem;
    }
    .wrap p.lead {
      color: var(--muted);
      margin: 0 0 2.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      text-align: left;
    }
    a.card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      text-decoration: none;
      color: var(--fg);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }
    a.card:hover {
      transform: translateY(-6px) rotate(-1deg);
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.1);
    }
    a.card .emoji {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    a.card h2 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.1rem;
      margin: 0 0 0.3rem;
    }
    a.card p {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
      line-height: 1.5;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧪 LAB</h1>
    <p class="lead">思いついたものを気軽に置いていく実験場。</p>
    <div class="grid">
      <a class="card" href="portfolio/">
        <span class="emoji">🎨</span>
        <h2>Portfolio</h2>
        <p>コミカルで動的なランディングページ(仮)。</p>
      </a>
      <a class="card" href="reaction/">
        <span class="emoji">⚡</span>
        <h2>反応速度テスト</h2>
        <p>光ったらタップ。ベストタイムを記録。</p>
      </a>
      <a class="card" href="pomodoro/">
        <span class="emoji">🍅</span>
        <h2>ポモドーロタイマー</h2>
        <p>25分集中・5分休憩をゆるく管理。</p>
      </a>
      <a class="card" href="goo/">
        <span class="emoji">🫧</span>
        <h2>ぷにぷに</h2>
        <p>タップで増やして、つまんで投げる液体ブロブ。</p>
      </a>
      <a class="card" href="trends/">
        <span class="emoji">🧭</span>
        <h2>流行り比較</h2>
        <p>フレームワーク・ビルドツール・デスクトップランタイムを図とカードで比較。</p>
      </a>
    </div>
    <footer>Built with plain HTML / CSS / JS · GitHub Pages</footer>
  </div>
</body>
</html>
