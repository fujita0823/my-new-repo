<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c5cff" />
  <title>Tactic Board · LAB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-shell">
    <div class="topbar">
      <span class="brand"><strong>TACTIC</strong> BOARD</span>
      <input id="strat-name-input" type="text" placeholder="ストラット名" />
      <select id="map-select" title="マップ"></select>
      <span class="spacer"></span>
      <button id="btn-new" class="btn">新規</button>
      <button id="btn-save" class="btn">保存</button>
      <label class="btn btn-file" for="import-file">読み込み</label>
      <input id="import-file" type="file" accept="application/json" hidden />
      <button id="btn-export" class="btn">JSON書き出し</button>
      <button id="btn-share" class="btn btn-primary">共有リンク</button>
    </div>

    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>配置するサイド</h3>
        <div class="side-toggle">
          <button class="side-toggle-btn active" data-side="attack">ATK 攻撃</button>
          <button class="side-toggle-btn" data-side="defense">DEF 防衛</button>
        </div>
        <p class="muted small">エージェントをクリックしてから、盤面をクリックすると配置されます。</p>
      </div>
      <div class="sidebar-section">
        <h3>エージェント</h3>
        <input id="agent-search" type="text" placeholder="エージェントを検索…" />
        <div id="agent-palette"></div>
      </div>
      <div class="sidebar-section">
        <h3>保存済みストラット</h3>
        <div id="saved-list"></div>
      </div>
    </aside>

    <div class="board-wrap">
      <div class="toolbar">
        <div class="tool-group">
          <button class="tool-btn" data-mode="select" title="選択・移動"><span class="tool-icon">↖</span>選択</button>
          <button class="tool-btn" data-mode="arrow" title="矢印を描画"><span class="tool-icon">↗</span>矢印</button>
          <button class="tool-btn" data-mode="marker" title="アビリティ/メモのマーカー"><span class="tool-icon">⚑</span>マーカー</button>
          <button class="tool-btn" data-mode="text" title="テキストラベル"><span class="tool-icon">T</span>テキスト</button>
          <button class="tool-btn" data-mode="eraser" title="クリックで削除"><span class="tool-icon">✕</span>消しゴム</button>
        </div>
        <div id="color-palette"></div>
        <div class="tool-group">
          <button id="btn-undo" class="btn" title="元に戻す(Ctrl+Z)">↶ Undo</button>
          <button id="btn-redo" class="btn" title="やり直す(Ctrl+Y)">↷ Redo</button>
        </div>
      </div>
      <p class="map-disclaimer muted small">
        マップ図は模式的なブループリントです(実際の形状とは異なります)。コールアウト名は既知の一般的な呼称を参考にしています。誤りがあれば教えてください。
      </p>
      <div class="board-area">
        <svg id="board-svg" viewBox="0 0 1000 1000">
          <defs>
            <marker id="arrowhead-white" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f4f4f5" /></marker>
            <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef4444" /></marker>
            <marker id="arrowhead-cyan" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee" /></marker>
            <marker id="arrowhead-yellow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#eab308" /></marker>
            <marker id="arrowhead-violet" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c5cff" /></marker>
          </defs>
          <g id="map-layer"></g>
          <rect id="board-bg-hit" x="0" y="0" width="1000" height="1000" fill="transparent" />
          <g id="content-layer"></g>
        </svg>
      </div>
    </div>

    <div class="steps-bar">
      <div id="step-list"></div>
      <div class="steps-actions">
        <button id="btn-step-left" class="btn" title="左に移動">◀</button>
        <button id="btn-step-right" class="btn" title="右に移動">▶</button>
        <button id="btn-add-step" class="btn">＋ ステップ追加</button>
        <button id="btn-dup-step" class="btn">⧉ 複製</button>
        <button id="btn-del-step" class="btn">削除</button>
        <button id="btn-play" class="btn btn-primary">▶ 自動再生</button>
      </div>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-box" class="modal"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
