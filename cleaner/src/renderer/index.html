<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Gamer Cleaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎮 Gamer Cleaner</h1>
    <p class="lead">Steamライブラリの不要ファイルを見つけて、安全にゴミ箱へ。</p>
  </header>

  <section class="controls">
    <button id="pick-btn" class="btn primary" type="button">📁 Steamライブラリを選ぶ</button>
    <span id="root-path" class="root-path">まだ選択されていません</span>
    <button id="scan-btn" class="btn" type="button" disabled>スキャン開始</button>
  </section>

  <p id="status" class="status"></p>

  <section id="summary" class="summary hidden">
    <div>
      <strong id="safe-total">0 B</strong> 削除して安全な容量が見つかりました
    </div>
    <button id="trash-btn" class="btn danger" type="button" disabled>選択項目をゴミ箱へ移動</button>
  </section>

  <main id="results" class="results"></main>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <h2>ゴミ箱に移動しますか?</h2>
      <p id="confirm-summary"></p>
      <ul id="confirm-list" class="confirm-list"></ul>
      <p class="hint">ゴミ箱経由なので、間違えてもあとで元に戻せます。</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn" type="button">キャンセル</button>
        <button id="confirm-ok" class="btn danger" type="button">ゴミ箱へ移動する</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
